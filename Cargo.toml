[workspace]
resolver = "2"
members = ["crates/iwr-core", "crates/iwr-ui", "crates/iwr"]
exclude = ["examples/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MandoKa/IwannatRust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iwr-core = { path = "crates/iwr-core", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
