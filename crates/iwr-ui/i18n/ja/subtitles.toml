live = "一度作成してください：`codecast translate codecast/ --lang {code}` を実行する（オフラインモデル、キャッシュされます）か、その言語でコードキャストを一度再生します。確認済みの翻訳にするには、`codecast translate codecast/ --lang {code} --pieces > codecast/translations/{code}.json` を実行して値を埋めてください。"
