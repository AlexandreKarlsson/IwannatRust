keep = "Keep them"
delete_all = "Delete all out-of-date"
delete_them = "Delete them"

[sets]
title = "Recorded voices"
text = "Each voice or pair keeps its own recordings. Complete records the parts it lacks — changed or new — with the voice and delivery it was made with."
recorded = "{done}/{total} recorded"
changed = "{n} changed"
missing = "{n} missing"
select = "Select"
select_tip = "pick this voice, language and delivery in the form below"
nothing = "nothing to record"
record = "record {parts}"
complete = "✓ Complete"
complete_n = { one = "↻ Complete {n} part", other = "↻ Complete {n} parts" }
delete_n = { one = "Delete {n} recording?", other = "Delete {n} recordings?" }
complete_all = { one = "↻ Complete {n} voice", other = "↻ Complete all {n} voices" }

# names of the recording languages that `iwr_core::voice::VOICE_LANGS` gives in English
[voice_lang]
en_us = "English (US)"
