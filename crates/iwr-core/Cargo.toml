[package]
name = "iwr-core"
description = "Rust source analysis + graph model for IwannatRust visualizations"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parse", "fs"]
# syn-based parsing of Rust source text
parse = ["dep:syn", "dep:proc-macro2", "dep:quote"]
# walk a cargo project on disk (not for wasm)
fs = ["parse", "dep:walkdir", "dep:toml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits", "visit"], optional = true }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
toml = { version = "0.8", optional = true }
