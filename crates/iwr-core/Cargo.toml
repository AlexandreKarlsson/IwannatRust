[package]
name = "iwr-core"
description = "Rust and C source analysis + graph model for IwannatRust visualizations"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parse", "fs"]
# syn-based parsing of Rust source text, tree-sitter parsing of C
parse = ["dep:syn", "dep:proc-macro2", "dep:quote", "dep:tree-sitter", "dep:tree-sitter-c"]
# walk a cargo project on disk (not for wasm)
fs = ["parse", "dep:walkdir", "dep:toml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits", "visit"], optional = true }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
walkdir = { version = "2", optional = true }
toml = { version = "0.8", optional = true }

[build-dependencies]
iwr-i18n-gen = { path = "../iwr-i18n-gen" }
